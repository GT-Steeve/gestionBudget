<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Même politique que les pages du site : aucun script ni style inline, aucune connexion. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animation pièces</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="demo-card">
    <div id="coins"></div>
    <p class="demo-label" id="label"></p>
    <div class="demo-dots" id="dots"></div>
    <div class="demo-controls">
      <button type="button" id="prev" aria-label="Scène précédente">◀</button>
      <button type="button" id="toggle">Pause</button>
      <button type="button" id="next" aria-label="Scène suivante">▶</button>
      <button type="button" id="restart" aria-label="Recommencer">↺</button>
      <button type="button" id="theme" aria-label="Changer de thème">◐</button>
      <button type="button" id="version">Version 2</button>
    </div>
  </div>

  <script src="../assets/js/coin-story.js"></script>
  <script src="demo.js"></script>
</body>
</html>
